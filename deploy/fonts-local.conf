<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Nomes das fontes carregadas no Canvix que o fontconfig nao conhece:
     "Montserrat Regular" e o ficheiro Regular da familia Montserrat. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Montserrat Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Montserrat</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>regular</const></edit>
  </match>
</fontconfig>
