# Canvix (design por IA). Acessivel de fora; o MCP exige token Bearer.
server {
    listen 80;
    listen [::]:80;
    server_name canva.viagemdesonho.pt;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canva.viagemdesonho.pt;

    ssl_certificate     /etc/letsencrypt/live/canva.viagemdesonho.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canva.viagemdesonho.pt/privkey.pem;


    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/canvix-mcp-chatgpt.conf;  # MCP para o ChatGPT (endereco secreto)

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;   # SSE da colaboracao
    }
}
